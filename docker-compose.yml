services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sangam_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sangam
      POSTGRES_USER: sangam
      POSTGRES_PASSWORD: sangam
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sangam -d sangam']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
